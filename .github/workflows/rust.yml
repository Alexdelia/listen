name: rust

on:
  push:
    branches: ["main"]
    paths-ignore: ["listen.ron"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DUCKDB_VERSION: v1.5.5

jobs:
  test:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: libduckdb
        run: |
          curl -fsSL -o /tmp/libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/$DUCKDB_VERSION/libduckdb-linux-amd64.zip"
          unzip -q /tmp/libduckdb.zip -d "$HOME/libduckdb"
          echo "DUCKDB_LIB_DIR=$HOME/libduckdb" >>"$GITHUB_ENV"
          echo "DUCKDB_INCLUDE_DIR=$HOME/libduckdb" >>"$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/libduckdb" >>"$GITHUB_ENV"

      - name: format
        run: cargo fmt --check

      - name: build
        run: cargo build --all-features

      - name: clippy
        run: cargo clippy --all-features -- -D warnings

      - name: test
        run: cargo test --all-features
